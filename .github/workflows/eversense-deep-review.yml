name: Eversense deep review validation

on:
  pull_request:
    branches:
      - automation/eversense-deep-review

permissions:
  contents: read

jobs:
  validate-review-fixes:
    runs-on: ubuntu-latest
    steps:
      - name: Check out staged review branch
        uses: actions/checkout@v4
        with:
          ref: tmp/eversense-deep-review-fixes
          fetch-depth: 0
          show-progress: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Static safety checks
        shell: bash
        run: |
          set -euo pipefail
          git fetch --quiet origin feature/eversense-integration
          git diff --check origin/feature/eversense-integration...HEAD
          ! grep -RIn --include='*.kt' 'SessionKey = ' plugins/eversense
          ! grep -RIn --include='*.kt' 'printStackTrace' plugins/eversense
          ! grep -RIn --include='*.kt' 'matches(Regex("T\\d+.*"))' plugins/source/src/main/kotlin/app/aaps/plugins/source/activities/EversenseStatusActivity.kt

      - name: Run focused integration checks
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace \
            :plugins:eversense:testFullDebugUnitTest \
            :plugins:eversense:lintFullDebug \
            :plugins:source:compileFullDebugKotlin \
            :core:data:test \
            :core:keys:compileFullDebugKotlin \
            :database:impl:compileFullDebugKotlin \
            :database:persistence:compileFullDebugKotlin \
            :app:compileFullDebugKotlin \
            2>&1 | tee /tmp/eversense-review-tests.log

      - name: Upload validation log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eversense-deep-review-validation
          path: /tmp/eversense-review-tests.log
          if-no-files-found: warn
          retention-days: 14
