name: Eversense repository-wide lint

on:
  pull_request:
    branches:
      - automation/eversense-deep-review

permissions:
  contents: read

jobs:
  full-debug-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Check out merged integration branch
        uses: actions/checkout@v4
        with:
          ref: feature/eversense-integration
          fetch-depth: 0
          show-progress: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run all full-debug lint checks
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace lintFullDebug \
            2>&1 | tee /tmp/eversense-all-lint.log

      - name: Upload lint log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eversense-repository-wide-lint
          path: /tmp/eversense-all-lint.log
          if-no-files-found: warn
          retention-days: 14
