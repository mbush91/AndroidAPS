name: Eversense source-module lint

on:
  pull_request:
    branches:
      - automation/eversense-deep-review

permissions:
  contents: read

jobs:
  source-module-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Check out merged integration branch
        uses: actions/checkout@v4
        with:
          ref: feature/eversense-integration
          fetch-depth: 0
          show-progress: false

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Run source-module lint
        shell: bash
        run: |
          set -o pipefail
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace :plugins:source:lintFullDebug \
            2>&1 | tee /tmp/eversense-source-lint.log

      - name: Upload source lint log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eversense-source-module-lint
          path: /tmp/eversense-source-lint.log
          if-no-files-found: warn
          retention-days: 14
