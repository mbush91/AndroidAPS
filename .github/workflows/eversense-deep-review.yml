name: Eversense static diagnostics

on:
  pull_request:
    branches:
      - automation/eversense-deep-review

permissions:
  contents: read

jobs:
  static-diagnostics:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out merged integration branch
        uses: actions/checkout@v4
        with:
          ref: feature/eversense-integration
          fetch-depth: 0
          show-progress: false

      - name: Run static diagnostics
        shell: bash
        run: |
          set +e
          status=0
          git fetch --quiet origin dev
          {
            echo '--- git diff --check ---'
            git diff --check origin/dev...HEAD || status=1
            echo '--- session-key logging ---'
            if grep -RIn --include='*.kt' 'SessionKey = ' plugins/eversense; then status=1; else echo 'none'; fi
            echo '--- printStackTrace usage ---'
            if grep -RIn --include='*.kt' 'printStackTrace' plugins/eversense; then status=1; else echo 'none'; fi
            echo '--- obsolete transmitter-name filter ---'
            if grep -RIn --include='*.kt' 'matches(Regex("T\\d+.*"))' plugins/source/src/main/kotlin/app/aaps/plugins/source/activities/EversenseStatusActivity.kt; then status=1; else echo 'none'; fi
            echo "--- result: $status ---"
          } 2>&1 | tee /tmp/eversense-static-diagnostics.log
          exit "$status"

      - name: Upload static diagnostics
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eversense-static-diagnostics
          path: /tmp/eversense-static-diagnostics.log
          if-no-files-found: error
          retention-days: 14
