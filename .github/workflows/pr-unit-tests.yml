name: PR Unit Tests

on:
  pull_request:
    branches:
      - dev
    types:
      - opened
      - synchronize
      - reopened
      - ready_for_review

# PR checks only need to read source. Never expose signing / Google Drive secrets
# or run the release-build/upload jobs for untrusted PR code.
permissions:
  contents: read

concurrency:
  group: pr-unit-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  unit-tests:
    name: Full Debug JVM unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Check out pull request
        uses: actions/checkout@v5

      # Matches buildSrc/src/main/kotlin/Versions.kt (Java 21 / JVM 21)
      # and the current Gradle wrapper / Android Gradle Plugin.
      - name: Set up Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      # This branch compiles against Android API 37.
      # Android 37 is published as a minor-versioned SDK (37.0), not android-37.
      - name: Install Android SDK platform and build tools
        run: sdkmanager --channel=3 --install "platforms;android-37.0" "build-tools;37.0.0"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run Full Debug unit tests
        run: |
          chmod +x ./gradlew
          ./gradlew testFullDebugUnitTest \
            --continue \
            --stacktrace \
            --max-workers=2 \
            --no-parallel \
            -Dorg.gradle.jvmargs="-Xmx4g -XX:+UseParallelGC -Xss1024m" \
            -Dkotlin.daemon.jvm.options="-Xmx1536m" \
            -Dkotlin.compiler.execution.strategy=in-process

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr-jvm-unit-test-reports
          path: |
            **/build/test-results/testFullDebugUnitTest/**
            **/build/reports/tests/testFullDebugUnitTest/**
          if-no-files-found: ignore
          retention-days: 7
